<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Simple Store Demo{% endblock %}</title>
  <style>
    /* Intentionally basic: this project is still a work-in-progress demo. */
    body { max-width: 1000px; margin: 0 auto; padding: 0 18px; font: 16px/1.5 Arial, sans-serif; color: #222; background: #fff; }
    header { border-bottom: 2px solid #222; padding: 20px 0 14px; }
    header h1 { margin: 0 0 6px; font-size: 26px; }
    nav a { margin-right: 16px; color: #0645ad; }
    main { min-height: 65vh; padding: 28px 0; }
    footer { border-top: 1px solid #bbb; padding: 16px 0 28px; color: #666; font-size: 14px; }
    .notice { padding: 12px; border: 1px solid #e5bd63; background: #fff8d8; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; margin-top: 24px; }
    .product { border: 1px solid #bbb; padding: 12px; }
    .product img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .price { font-weight: bold; }
    .product-detail { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(260px, 1fr); gap: 28px; }
    .product-detail img { max-width: 100%; max-height: 420px; object-fit: contain; }
    form { max-width: 380px; }
    input { display: block; width: 100%; padding: 8px; margin: 8px 0 14px; border: 1px solid #888; }
    button, .button { display: inline-block; padding: 8px 12px; border: 1px solid #333; background: #eee; color: #111; text-decoration: none; cursor: pointer; }
    .alert { padding: 10px; margin-bottom: 12px; background: #f4e5e5; border: 1px solid #c99; }
    @media (max-width: 600px) { .product-detail { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'index' %}">Simple Store</a></h1>
    <nav>
      <a href="{% url 'index' %}">Home</a>
      {% if request.user.is_authenticated %}<span>Signed in as {{ request.user.username }}</span>{% else %}<a href="{% url 'login' %}">Login</a><a href="{% url 'register' %}">Register</a>{% endif %}
    </nav>
  </header>
  <main>{% block start %}{% endblock %}</main>
  <footer>Simple Store demo — features are still being built.</footer>
</body>
</html>
